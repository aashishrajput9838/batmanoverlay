[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batmanoverlay"
version = "1.0.0"
description = "Portable Windows Productivity & Presentation Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "batmanoverlay Core Team", email = "engineering@batmanoverlay.com"}
]
dependencies = [
    "PySide6>=6.7.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.2",
    "psutil>=5.9.8",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.1",
    "mypy>=1.9.0",
    "import-linter>=2.0",
    "pip-audit>=2.7.2",
    "pyinstaller>=6.5.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # sys.version checks
    "ASYNC", # async checks
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "EXE", # flake8-executable
    "FA",  # flake8-future-annotations
    "ICN", # flake8-import-conventions
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = [
    "A003", # Class attribute is shadowing a python builtin
    "A005", # Module shadowing stdlib (platform, typing package shells)
    "N802", # Function name should be lowercase (Qt paintEvent override)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["src"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Layered architecture enforcement"
type = "layers"
containers = ["src"]
layers = [
    "ui",
    "browser | clipboard | typing",
    "core",
    "storage",
    "platform",
    "models",
]

[[tool.importlinter.contracts]]
name = "Domain module independence"
type = "independence"
modules = [
    "src.browser",
    "src.clipboard",
    "src.typing",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Quick unit tests",
    "integration: Multi-module integration tests",
    "ui: PySide6 widget tests requiring qtbot",
    "performance: Benchmarks and performance tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/platform/win_api.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
